services:
  rabbitmq:
    image: rabbitmq:3.13.7-management
    user: rabbitmq
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
      RABBITMQ_CTL_ERL_ARGS: "+S 1:1"
      RABBITMQ_DEFAULT_USER: geblang
      RABBITMQ_DEFAULT_PASS: queue_test
    command: ["bash", "-ec", "rabbitmq-plugins enable --offline rabbitmq_stomp; exec docker-entrypoint.sh rabbitmq-server"]
    ports:
      - "127.0.0.1::5672"
      - "127.0.0.1::61613"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 2s
      timeout: 10s
      retries: 60
  kafka:
    image: redpandadata/redpanda:v24.3.3
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "512M", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "0.0.0.0:9092", "--advertise-kafka-addr", "127.0.0.1:${GEBLANG_JOBS_KAFKA_PORT:-19092}"]
    ports:
      - "127.0.0.1:${GEBLANG_JOBS_KAFKA_PORT:-19092}:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=127.0.0.1:9092"]
      interval: 2s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: geblang
      POSTGRES_PASSWORD: queue_test
      POSTGRES_DB: jobs
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geblang -d jobs"]
      interval: 1s
      timeout: 3s
      retries: 60
  mysql:
    image: mysql:8.4.3
    environment:
      MYSQL_ROOT_PASSWORD: queue_test
      MYSQL_DATABASE: jobs
      MYSQL_USER: geblang
      MYSQL_PASSWORD: queue_test
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u geblang -pqueue_test jobs -e 'SELECT 1'"]
      interval: 1s
      timeout: 3s
      retries: 90
